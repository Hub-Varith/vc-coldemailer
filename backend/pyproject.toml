[project]
name = "vc-coldemailer-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "composio>=0.18.0",
    "fastapi[standard]>=0.139.2",
    "openai>=2.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Self-contained workspace root: prevents uv from discovering a parent
# workspace (~/coding/pyproject.toml) and trying to resolve its members.
[tool.uv.workspace]
members = []
