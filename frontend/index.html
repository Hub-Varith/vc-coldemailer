<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proofline — Investor Intelligence Workspace</title>
    <meta
      name="description"
      content="A live, verified investor target list where every name arrives with dated evidence and a ready-to-send first line."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #070707;
        color: #6b6b6b;
        font: 500 11px/1 'JetBrains Mono', ui-monospace, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #boot b { color: #ededed; font-weight: 700; letter-spacing: -0.01em; text-transform: none; font-size: 15px; }
      #boot i { width: 6px; height: 6px; border-radius: 999px; background: #daff00; animation: p 1.1s ease-in-out infinite; }
      @keyframes p { 0%, 100% { opacity: 1 } 50% { opacity: 0.2 } }
      #root:not(:empty) + #boot { display: none }
    </style>
    <div id="root"></div>
    <div id="boot"><b>P/</b> <i></i> Waking the workspace</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
